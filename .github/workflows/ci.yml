name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q
      - name: smoke — gateway boots and mocks a completion
        run: |
          python -m uvicorn gateway:app --port 3100 &
          sleep 4
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3100/health)
          test "$code" = 200
